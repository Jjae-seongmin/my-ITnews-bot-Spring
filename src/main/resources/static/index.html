<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>hello-NewsBot 시작하기</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body>
<h1>📰 hello-NewsBot</h1>
<p class="desc">텔레그램으로 관심 있는 IT 뉴스를 매일 받아보세요.</p>

<button id="startBtn">텔레그램으로 시작하기</button>
<div id="statusText" class="status"></div>

<script>
    // 이 페이지가 하는 일:
    // 1) 버튼 클릭 -> 서버에 연결코드(linkCode) 발급 요청 (POST /link/start)
    // 2) 받은 딥링크(t.me/봇이름?start=코드)를 새 탭으로 열어 텔레그램 /start 화면으로 이동
    // 3) 사용자가 텔레그램에서 /start 를 누르면 서버의 웹훅이 비동기로 연결을 완료시키므로,
    //    프론트는 그 사실을 알 수 없다 -> /link/status 를 주기적으로 물어보며(polling) 기다린다.
    // 4) 연결이 확인되면 userId 를 저장해두고 피드 선택 화면으로 이동한다.

    const startBtn = document.getElementById('startBtn');
    const statusText = document.getElementById('statusText');
    let pollTimer = null;

    startBtn.addEventListener('click', async () => {
        startBtn.disabled = true;
        statusText.textContent = '연결 코드를 발급하는 중...';

        const res = await fetch('/link/start', { method: 'POST' });
        const data = await res.json(); // { linkCode, telegramUrl }

        localStorage.setItem('linkCode', data.linkCode);
        window.open(data.telegramUrl, '_blank');

        statusText.textContent = '텔레그램 앱에서 /start 를 눌러주세요. 연결을 기다리는 중...';
        pollStatus(data.linkCode);
    });

    function pollStatus(linkCode) {
        pollTimer = setInterval(async () => {
            const res = await fetch('/link/status?linkCode=' + encodeURIComponent(linkCode));
            const data = await res.json(); // { connected, userId }

            if (data.connected) {
                clearInterval(pollTimer);
                localStorage.setItem('userId', data.userId);
                statusText.textContent = '연결 완료! 피드 선택 화면으로 이동합니다...';
                window.location.href = '/feeds.html';
            }
        }, 2000); // 2초마다 확인 — 웹훅이 언제 들어올지 알 수 없으므로 간단히 폴링으로 처리
    }

    // 이미 이전에 연결을 마친 적이 있다면(localStorage 에 userId 가 남아있다면) 바로 피드 화면으로
    if (localStorage.getItem('userId')) {
        window.location.href = '/feeds.html';
    }
</script>
</body>
</html>
